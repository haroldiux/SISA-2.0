<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <title>SISA • Sistema Integral de Seguimiento Académico</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function() {
      try {
        localStorage.setItem('sisa_theme_preference', 'light');
        document.documentElement.classList.remove('dark');
        if (localStorage.getItem('scu_access_token')) {
          document.documentElement.classList.add('sisa-authenticated');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html.sisa-authenticated #view-login { display: none !important; }
    html.sisa-authenticated #sp-shell { display: flex !important; }
  </style>

  <!-- Fonts: Inter, Plus Jakarta Sans, Geist & Geist Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons (deferred; Tailwind compiled at build time) -->
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="h-full w-full min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 select-none transition-colors duration-200">
  <scu-root></scu-root>
  <script src="assets/app-controller.js?v=2.9.3" defer></script>
</body>
</html>
