<div class="scu-executive-workspace">
  <!-- Executive Header with Actions -->
  <div class="flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="font-extrabold text-2xl">Tablero de Control Vicerrectorado Nacional</h2>
      <p class="text-xs text-color-secondary">Gobernanza académica consolidada multi-sede UNITEPC • Gestión 1-2026</p>
    </div>

    <div class="flex align-items-center gap-2">
      <button
        pButton
        type="button"
        label="Descargar PDF Ejecutivo"
        icon="pi pi-file-pdf"
        [loading]="isExporting"
        (click)="onExportReport('PDF')"
        class="p-button-outlined p-button-danger p-button-sm">
      </button>

      <button
        pButton
        type="button"
        label="Consolidado XLSX"
        icon="pi pi-file-excel"
        [loading]="isExporting"
        (click)="onExportReport('XLSX')"
        class="p-button-outlined p-button-success p-button-sm">
      </button>
    </div>
  </div>

  <div *ngIf="exportSuccess" class="p-message p-message-success mb-3 p-2 text-sm font-semibold">
    <i class="pi pi-check mr-2"></i> {{ exportSuccess }}
  </div>

  <!-- Macro KPIs -->
  <div class="mb-4">
    <scu-macro-kpi-cards></scu-macro-kpi-cards>
  </div>

  <!-- Cross-Branch Benchmark Table -->
  <div>
    <scu-cross-branch-benchmark></scu-cross-branch-benchmark>
  </div>
</div>
