server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sisa-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  cache:
    type: caffeine
    cache-names:
      - gateway-groups
      - gateway-branch-offices
      - gateway-careers
      - gateway-courses
      - catalogo-docentes
    caffeine:
      spec: maximumSize=500,expireAfterWrite=900s

sisa:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 28800000 # 8 hours
    refresh-expiration-ms: 604800000 # 7 days
  templates:
    base-path: classpath:templates/

app:
  unitepc:
    gateway:
      base-url: ${UNITEPC_GATEWAY_URL:https://gw-dev.unitepc.solutions}
      client-id: ${UNITEPC_CLIENT_ID:dev-syseng-research}
      client-secret: ${UNITEPC_CLIENT_SECRET:1XqjSsWL01xegB12z3mGKpF6eeFQLsZd}
      request-client-id: ${UNITEPC_REQUEST_CLIENT_ID:sea-evaluaciones}
      token-endpoint: ${UNITEPC_TOKEN_ENDPOINT:/auth/token}
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
