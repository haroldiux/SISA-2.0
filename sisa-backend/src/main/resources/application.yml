server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: sisa-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

sisa:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 28800000 # 8 hours
    refresh-expiration-ms: 604800000 # 7 days
  templates:
    base-path: classpath:templates/

app:
  unitepc:
    gateway:
      base-url: ${UNITEPC_GATEWAY_URL:https://gw-dev.unitepc.solutions}
      client-id: ${UNITEPC_CLIENT_ID:sisa-backend}
      client-secret: ${UNITEPC_CLIENT_SECRET:sisa-secret-2026}
      token-endpoint: ${UNITEPC_TOKEN_ENDPOINT:/auth/token}
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
